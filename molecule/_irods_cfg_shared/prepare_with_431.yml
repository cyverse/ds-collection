---
- name: Base | prepare
  ansible.builtin.import_playbook: prepare.yml


- name: Prepare | prepare for iRODS
  hosts: all
  tasks:
    - name: Install iRODS package repository signing key
      ansible.builtin.rpm_key:
        key: https://packages.irods.org/irods-signing-key.asc

    - name: Install iRODS repository
      ansible.builtin.get_url:
        url: https://packages.irods.org/renci-irods.yum.repo
        dest: /etc/yum.repos.d/renci-irods.yum.repo
        mode: u+r

    # The repository signs its metadata, so dnf has to accept the key before it can read it.
    - name: Import the repository's signing key
      ansible.builtin.command: dnf --assumeyes makecache
      changed_when: false

    - name: Lock irods packages to required version
      community.general.yum_versionlock:
        name:
          - irods-database-plugin-postgres-4.3.1
          - irods-icommands-4.3.1
          - irods-runtime-4.3.1
          - irods-server-4.3.1
        state: present


- name: Prepare | install DBMS
  hosts: irods_catalog
  tasks:
    - name: Install PostgreSQL server
      ansible.builtin.dnf:
        name:
          - postgresql-contrib
          - postgresql-server
        state: present

    - name: Install PostgreSQL 12 repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/pgdg-12.repo
        mode: a+r
        content: |
          [pgdg12-archive]
          name=PostgreSQL 12 RPMs for RHEL/Rocky Linux/AlmaLinux 9
          baseurl=https://yum-archive.postgresql.org/12/redhat/rhel-9-x86_64
          enabled=1
          gpgcheck=0

    - name: Install PostgreSQL 12 ODBC driver
      ansible.builtin.dnf:
        name: postgresql12-odbc
        state: present

    # unixODBC's stock PostgreSQL entry points at the AppStream driver, which isn't installed.
    - name: Define PostgreSQL 12 ODBC driver
      ansible.builtin.command:
        cmd: odbcinst -i -d -r
        stdin: |
          [PostgreSQL]
          Description = PostgreSQL 12 ODBC Driver
          Driver = /usr/pgsql-12/lib/psqlodbc.so
          Setup = /usr/pgsql-12/lib/psqlodbcw.so
      changed_when: true

    # systemd-tmpfiles would create this, but the containers don't run systemd.
    - name: Create PostgreSQL socket directory
      ansible.builtin.file:
        path: /run/postgresql
        state: directory
        owner: postgres
        group: postgres
        mode: "0755"


- name: Prepare | initialize DBMS
  hosts: irods_catalog
  become: true
  become_user: postgres
  become_flags: '-i'
  gather_facts: false
  tasks:
    - name: Initialize PostgreSQL database cluster
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          if [[ -e "$PGDATA" ]] && [[ -z "$(ls --almost-all "$PGDATA")" ]]; then
            initdb --pgdata="$PGDATA" --auth=ident
          fi
      register: response
      changed_when: response.stdout != ''

    - name: Start PostgreSQL
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o errexit
          if ! [[ -e "$PGDATA"/postmaster.pid ]]; then
            pg_ctl start --wait > /dev/null
            echo changed
          fi
      register: response
      changed_when: response.stdout == 'changed'


- name: Prepare | install iRODS
  hosts: all
  tasks:
    # irods-server needs irods-icommands but doesn't declare it.
    - name: Install iRODS server
      ansible.builtin.dnf:
        name:
          - irods-icommands
          - irods-server
        state: present


- name: Prepare | initialize irods DB plugin
  hosts: irods_catalog
  gather_facts: false
  tasks:
    - name: Install postgresql module prerequisites
      ansible.builtin.pip:
        name: psycopg2-binary

    - name: Install iRODS database plugin
      ansible.builtin.dnf:
        name: irods-database-plugin-postgres
        state: present


- name: Prepare | initialize DBMS
  hosts: irods_catalog
  become: true
  become_user: postgres
  become_flags: '-i'
  gather_facts: false
  tasks:
    - name: Create ICAT DB
      community.postgresql.postgresql_db:
        name: ICAT

    - name: Create iRODS user
      community.postgresql.postgresql_user:
        name: irods
        password: testpassword

    - name: Grant iRODS user full access to ICAT DB
      community.postgresql.postgresql_privs:
        db: postgres
        privs: ALL
        type: database
        obj: ICAT
        roles: irods

    - name: Configure irods user ICAT access
      community.postgresql.postgresql_pg_hba:
        dest: "{{ pg_hba_path }}"
        contype: host
        users: irods
        source: 127.0.0.1/32
        databases: ICAT
        method: md5
        state: present
      notify: Reload postgres

    - name: Remove ident access to DBMS
      community.postgresql.postgresql_pg_hba:
        dest: "{{ pg_hba_path }}"
        contype: host
        users: all
        source: "{{ item }}"
        databases: all
        method: md5
        state: present
      loop:
        - 127.0.0.1/32
        - ::1/128
      notify: Reload postgres

  handlers:
    - name: Reload postgres
      ansible.builtin.command: pg_ctl reload
      changed_when: true
