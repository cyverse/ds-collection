---
- name: Converge | check the versions
  hosts: all
  gather_facts: false
  tasks:
    - name: Check the upgrade is to a later release
      ansible.builtin.assert:
        that: irods_upgrade_version is version(irods_version, '>')
        fail_msg: >-
          IRODS_UPGRADE_VERSION ({{ irods_upgrade_version }}) has to be later than IRODS_VERSION
          ({{ irods_version }}), or the scenario tests no upgrade.


- name: Converge | Stop iRODS
  hosts: all
  gather_facts: false
  become: true
  become_user: irods
  tasks:
    - name: Stop iRODS
      ansible.builtin.command: /var/lib/irods/irodsctl stop
      register: resp
      changed_when: false
      failed_when: false


- name: Converge | update version lock
  hosts: all
  gather_facts: false
  tasks:
    - name: Remove the starting version lock
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: >-
          yum versionlock delete
            irods-database-plugin-postgres-{{ irods_version }}
            irods-icommands-{{ irods_version }}
            irods-runtime-{{ irods_version }}
            irods-server-{{ irods_version }}
      register: resp
      changed_when: resp.stdout is regex('Deleting versionlock')

    - name: Add the upgrade version lock
      community.general.yum_versionlock:
        name:
          - irods-database-plugin-postgres-{{ irods_upgrade_version }}
          - irods-icommands-{{ irods_upgrade_version }}
          - irods-runtime-{{ irods_upgrade_version }}
          - irods-server-{{ irods_upgrade_version }}
        state: present
# XXX - Due to https://github.com/ansible-collections/community.general/issues/4470, this isn't
# idempotent.
      tags: molecule-idempotence-notest
# XXX - ^^^


- name: Converge | upgrade iRODS packages
  hosts: all
  gather_facts: false
  tasks:
    # irods-server doesn't declare irods-icommands, so it's upgraded explicitly.
    - name: Upgrade
      ansible.builtin.dnf:
        name:
          - irods-database-plugin-postgres
          - irods-icommands
          - irods-runtime
          - irods-server
        state: latest  # noqa: package-latest


- name: Converge | upgrade iRODS
  hosts: all
  become: true
  become_user: irods
  gather_facts: false
  tasks:
    - name: Restart iRODS
      ansible.builtin.command: /var/lib/irods/irodsctl start
      changed_when: false

    - name: Ensure configuration is correct
      ansible.builtin.include_role:
        name: cyverse.ds.irods_cfg
        tasks_from: main.yml
