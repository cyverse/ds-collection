---
driver:
  name: docker
platforms:
  - name: alma9.localdomain
    image: alma9-irods
    pre_build_image: false
    dockerfile: ../_irods_cfg_shared/alma9.dockerfile
    hostname: alma9.localdomain
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        vars:
          ansible_python_interpreter: /usr/bin/python3
          irods_cfg_validate: true
