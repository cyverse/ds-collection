---
driver:
  name: docker
platforms:
  - name: provider-cfg
    image: provider
    dockerfile: provider/Dockerfile
    pre_build_image: false
    command: /usr/sbin/init
    hostname: provider.molecule
    privileged: true
    tty: true
    shm_size: 256m
    docker_networks:
      - name: molecule
    networks:
      - name: molecule
    network_mode: molecule
    purge_network: true
  - name: consumer
    image: alma9-irods
    pre_build_image: false
    dockerfile: ../_irods_cfg_shared/alma9.dockerfile
    hostname: consumer.molecule
    docker_networks:
      - name: molecule
    networks:
      - name: molecule
    network_mode: molecule
    purge_network: true
  - name: provider-uncfg
    image: alma9-irods
    pre_build_image: false
    dockerfile: ../_irods_cfg_shared/alma9.dockerfile
    hostname: provider-uncfg
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        vars:
          ansible_python_interpreter: /usr/bin/python3
          irods_cfg_default_resource_name: ingestRes
          irods_cfg_validate: true
      irods_resource:
        vars:
          irods_cfg_catalog_provider_hosts:
            - provider.molecule
          irods_cfg_catalog_service_role: consumer
        hosts:
          consumer:
            irods_cfg_host: localhost
      irods_catalog:
        vars:
          irods_cfg_catalog_service_role: provider
        hosts:
          provider-uncfg:
            irods_cfg_database:
              db_host: 127.0.0.1
              db_odbc_driver: PostgreSQL
              db_password: testpassword
              db_username: irods
            irods_cfg_host: localhost
            pg_hba_path: /var/lib/pgsql/data/pg_hba.conf
