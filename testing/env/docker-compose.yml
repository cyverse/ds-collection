---
services:
  amqp:
    image: test-env-base:ubuntu2204-systemd
    cgroup: private
    platform: linux/amd64
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true

  sftp:
    build:
      context: .
      dockerfile: sftp/Dockerfile
    cgroup: private
    platform: linux/amd64
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true

  webdav_configured:
    build:
      context: .
      dockerfile: webdav/Dockerfile.configured
    cgroup: private
    platform: linux/amd64
    # No AppArmor profile, since docker-default denies the tmpfs mount webdav.yml makes for varnish
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true

  webdav_unconfigured:
    build:
      context: .
      dockerfile: webdav/Dockerfile.unconfigured
    cgroup: private
    platform: linux/amd64
    # No AppArmor profile, since docker-default denies the tmpfs mount webdav.yml makes for varnish
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true

  dbms_configured:
    build:
      context: .
      dockerfile: postgresql/Dockerfile.configured
      args:
        DB_USER: "$DB_USER"
        IRODS_DELAY_SERVER: "$IRODS_PROVIDER_CONF_HOST"
        IRODS_RESOURCES: "$IRODS_RES_CONF_CENTOS_NAME:$IRODS_CONSUMER_CONF_CENTOS_HOST:$IRODS_VAULT $IRODS_RES_CONF_INGEST_NAME:$IRODS_CONSUMER_CONF_CENTOS_HOST:$IRODS_INGEST_VAULT"
        IRODS_ZONE_NAME: "$IRODS_ZONE_NAME"
        IRODS_ZONE_PASSWORD: "$IRODS_CLERVER_PASSWORD"
    cgroup: private
    image: "${ENV_NAME}-dbms_configured:${ENV_IMAGE_TAG:-latest}"
    platform: linux/amd64
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true

  dbms_unconfigured:
    build:
      context: .
      dockerfile: postgresql/Dockerfile.unconfigured
    cgroup: private
    platform: linux/amd64
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true

  provider_configured:
    build:
      context: .
      dockerfile: irods-provider/Dockerfile.configured
      args:
        DB_USER: "$DB_USER"
        DBMS_HOST: "$DBMS_HOST"
        IRODS_DEFAULT_RESOURCE: "$IRODS_DEFAULT_RESOURCE"
        IRODS_HOST: "$IRODS_PROVIDER_CONF_HOST"
        IRODS_LAST_EPHEMERAL_PORT: $IRODS_LAST_EPHEMERAL_PORT
        IRODS_SCHEMA_VALIDATION: "$IRODS_SCHEMA_VALIDATION"
        IRODS_SYSTEM_GROUP: "$IRODS_PROVIDER_SYSTEM_GROUP"
        IRODS_VERSION: "${IRODS_VERSION:-4.3.1}"
        IRODS_ZONE_NAME: "$IRODS_ZONE_NAME"
        IRODS_ZONE_PASSWORD: "$IRODS_CLERVER_PASSWORD"
    # Tagged by version so building another iRODS release doesn't replace the default image
    image: "${ENV_NAME}-provider_configured:${ENV_IMAGE_TAG:-${IRODS_VERSION:-4.3.1}}"
    hostname: "$IRODS_PROVIDER_CONF_HOST"
    platform: linux/amd64
    privileged: true
    tty: true
    # A server that segfaults on startup (irods/irods#7747) leaves its shared
    # memory behind, and at Docker's 64 MB default the next server can't prepare
    # its rule engine cache, so its rules fail to read their variables.
    shm_size: 128mb
    depends_on:
      - dbms_configured

  provider_unconfigured:
    build:
      context: .
      dockerfile: irods-provider/Dockerfile.unconfigured
      args:
        DBMS_HOST: "$DBMS_HOST"
        IRODS_SYSTEM_GROUP: "$IRODS_PROVIDER_SYSTEM_GROUP"
    hostname: "$IRODS_PROVIDER_UNCONF_HOST"
    platform: linux/amd64
    privileged: true
    tty: true
    shm_size: 128mb

  consumer_configured_centos:
    build:
      context: .
      dockerfile: irods-consumer/Dockerfile.configured
      args:
        IRODS_CATALOG_PROVIDER: "$IRODS_PROVIDER_CONF_HOST"
        IRODS_DEFAULT_RESOURCE: "$IRODS_RES_CONF_CENTOS_NAME"
        IRODS_DEFAULT_VAULT: "$IRODS_VAULT"
        IRODS_HOST: "$IRODS_CONSUMER_CONF_CENTOS_HOST"
        IRODS_LAST_EPHEMERAL_PORT: $IRODS_LAST_EPHEMERAL_PORT
        IRODS_SCHEMA_VALIDATION: "$IRODS_SCHEMA_VALIDATION"
        IRODS_VERSION: "${IRODS_VERSION:-4.3.1}"
        IRODS_ZONE_NAME: "$IRODS_ZONE_NAME"
        IRODS_ZONE_PASSWORD: "$IRODS_CLERVER_PASSWORD"
    image: "${ENV_NAME}-consumer_configured_centos:${ENV_IMAGE_TAG:-${IRODS_VERSION:-4.3.1}}"
    hostname: "$IRODS_CONSUMER_CONF_CENTOS_HOST"
    platform: linux/amd64
    privileged: true
    tty: true
    shm_size: 128mb
    depends_on:
      - provider_configured

  consumer_unconfigured:
    build:
      context: .
      dockerfile: irods-consumer/Dockerfile.unconfigured
      args:
        IRODS_CATALOG_PROVIDER: "$IRODS_PROVIDER_CONF_HOST"
    hostname: "${ENV_NAME}-consumer_unconfigured-1.${DOMAIN}"
    platform: linux/amd64
    privileged: true
    tty: true
    shm_size: 128mb

  # The containerized resource server hosts run Docker, which needs systemd and can't keep its or
  # containerd's storage on the container's own overlay file system. The storage is in volumes that
  # outlive the environment, so the hosts build irods-rs from Docker's cache after the first time.
  consumer_containerized_alma:
    image: test-env-base:alma10-systemd
    cgroup: private
    hostname: "${ENV_NAME}-consumer_containerized_alma-1.${DOMAIN}"
    platform: linux/amd64
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true
    volumes:
      - consumer_containerized_alma_containerd:/var/lib/containerd
      - consumer_containerized_alma_docker:/var/lib/docker

  consumer_containerized_alma9:
    image: test-env-base:alma9-systemd
    cgroup: private
    hostname: "${ENV_NAME}-consumer_containerized_alma9-1.${DOMAIN}"
    platform: linux/amd64
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true
    volumes:
      - consumer_containerized_alma9_containerd:/var/lib/containerd
      - consumer_containerized_alma9_docker:/var/lib/docker

  consumer_containerized_ubuntu:
    image: test-env-base:ubuntu2404-systemd
    cgroup: private
    hostname: "${ENV_NAME}-consumer_containerized_ubuntu-1.${DOMAIN}"
    platform: linux/amd64
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    tty: true
    volumes:
      - consumer_containerized_ubuntu_containerd:/var/lib/containerd
      - consumer_containerized_ubuntu_docker:/var/lib/docker

  cbuoy:
    image: test-env-base:alma9
    platform: linux/amd64

  # The S3 resource tests reach it as s3, its service name. moto reads a dotted host name as a
  # virtual-hosted bucket, so the container's FQDN doesn't work.
  s3:
    build:
      context: .
      dockerfile: s3/Dockerfile
    platform: linux/amd64

# The controller creates these, and testing/env/clean removes them.
volumes:
  consumer_containerized_alma_containerd:
    external: true
    name: ${ENV_NAME}-consumer_containerized_alma-containerd
  consumer_containerized_alma_docker:
    external: true
    name: ${ENV_NAME}-consumer_containerized_alma-docker
  consumer_containerized_alma9_containerd:
    external: true
    name: ${ENV_NAME}-consumer_containerized_alma9-containerd
  consumer_containerized_alma9_docker:
    external: true
    name: ${ENV_NAME}-consumer_containerized_alma9-docker
  consumer_containerized_ubuntu_containerd:
    external: true
    name: ${ENV_NAME}-consumer_containerized_ubuntu-containerd
  consumer_containerized_ubuntu_docker:
    external: true
    name: ${ENV_NAME}-consumer_containerized_ubuntu-docker
