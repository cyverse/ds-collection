---
- name: Install ansible core facts requirement
  hosts: all:!unmanaged_systems:!localhost
  become: true
  gather_facts: false
  tasks:
    - name: Install dmidecode support
      ansible.builtin.package:
        name: dmidecode
        state: present
        use: "{{ _infra_package_manager }}"


- name: Install required packages for ansible
  hosts: all:!unmanaged_systems:!localhost
  become: true
  tasks:
    - name: Update apt cache on Ubuntu machines
      when: ansible_distribution == 'Ubuntu'
      ansible.builtin.apt:
        update_cache: true
      tags:
        - non_idempotent

    - name: Install EPEL repository on RedHat family machines
      when: ansible_os_family == 'RedHat'
      ansible.builtin.package:
        name: epel-release
        state: present

    # EPEL 8 and 9 packages depend on packages from CRB, which EL8 calls PowerTools.
    - name: Enable CRB repository on EL8 and EL9 machines
      when: ansible_os_family == 'RedHat' and ansible_distribution_major_version in ['8', '9']
      community.general.dnf_config_manager:
        name: "{{ 'powertools' if ansible_distribution_major_version == '8' else 'crb' }}"
        state: enabled

    - name: Install packages
      ansible.builtin.package:
        name:
          - acl
          - jq
          - python3
          - python3-pip
        state: present

    - name: Install packages on Ubuntu machines
      when: ansible_distribution == 'Ubuntu'
      ansible.builtin.package:
        name:
          - iproute2
          - python3-dns
          - python3-requests
          - python3-selinux
          - python3-virtualenv
        state: present

    - name: Install packages on EL8 and EL9 machines
      when: ansible_os_family == 'RedHat' and ansible_distribution_major_version in ['8', '9']
      ansible.builtin.package:
        name:
          - iproute
          - python3-dnf-plugin-versionlock
          - python3-dns
          - python3-libselinux
          - python3-requests
          - python3-virtualenv
        state: present

    - name: Install python-is-python3 on Ubuntu 22.04 machines
      when: >-
        ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('22.04', '>=')
      ansible.builtin.package:
        name: python-is-python3
        state: present

- name: Remove packages on ubuntu
  hosts: all:!unmanaged_systems:!localhost
  become: true
  tasks:
    - name: Remove unattended-upgrades on Ubuntu machines
      when: ansible_distribution == 'Ubuntu'
      ansible.builtin.apt:
        name: unattended-upgrades
        state: absent
      tags:
        - idempotent
