---
- name: Check release rule bases | verify the iRODS release has its own rule bases
  ansible.builtin.assert:
    that: query('ansible.builtin.fileglob', rulebases) | length > 0
    fail_msg: >-
      There are no rule bases for iRODS {{ _irods_version }}. Add a
      files/irods/etc/irods/{{ _irods_version }} directory with that release's version of each
      rule base in the other release directories.
    quiet: true
  vars:
    rulebases: files/irods/etc/irods/{{ _irods_version }}/*.re
