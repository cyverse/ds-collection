---
- name: Provision for iRODS
  hosts: irods:!irods_resource_container:!unmanaged_systems
  become: true
  tasks:
    - name: Provision RedHat family
      when: ansible_os_family == 'RedHat'
      block:
        - name: RedHat | install iRODS package repository signing key
          ansible.builtin.rpm_key:
            key: https://packages.irods.org/irods-signing-key.asc

        - name: RedHat | install iRODS repository
          ansible.builtin.get_url:
            url: https://packages.irods.org/renci-irods.yum.repo
            dest: /etc/yum.repos.d/renci-irods.yum.repo
            mode: u+r

        - name: RedHat | force import of GPG key
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              if ! resp="$(yum --assumeyes updateinfo)"; then
                exit 1
              fi
              if [[ "$resp" =~ irods-signing-key ]]; then
                echo changed
              fi
          register: response
          changed_when: response.stdout == 'changed'

        - name: RedHat | remove outdated irods package lock version
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o errexit -o pipefail
              # dnf lists locks as NAME-0:VERSION-RELEASE.*. tests/irods_provision.yml checks real
              # lock lines against a copy of this pattern, so keep the two in step.
              lock_pattern='^(irods-.+)-0:([0-9]+\.[0-9]+\.[0-9]+)[.-]'
              readarray -t irods_locks < <(yum versionlock list | sed --quiet '/^irods-/p')
              for lock in "${irods_locks[@]}"; do
                if ! [[ "$lock" =~ $lock_pattern ]]; then
                  continue
                fi
                pkg="${BASH_REMATCH[1]}"
                ver="${BASH_REMATCH[2]}"
                if [[ "$ver" != '{{ _irods_version }}' ]]; then
                  if ! yum versionlock delete "$pkg" > /dev/null; then
                    printf 'Failed to remove lock for %s\n' "$pkg" >&2
                  fi
                  echo changed
                fi
              done
          register: resp
          changed_when: resp.stdout is regex('^changed')

        - name: RedHat | lock irods packages to required version
# XXX - yum_versionlock version 10.6.0 will not lock packages that are not installed unlike the
# `yum versionlock` command
#           community.general.yum_versionlock:
#             name:
#               - irods-icommands-{{ _irods_version }}
#               - irods-netcdf-client_modules-{{ _irods_version }}.*
#               - irods-netcdf-icommands-{{ _irods_version }}.*
#               - irods-netcdf-server_modules-{{ _irods_version }}.*
#               - irods-resource-plugin-s3-{{ _irods_version }}.*
#               - irods-runtime-{{ _irods_version }}
#               - irods-server-{{ _irods_version }}
#             state: present
          ansible.builtin.command: yum versionlock add {{ item }}
          register: resp
          changed_when: resp.stdout is regex('Adding versionlock on')
          loop:
            - irods-*-{{ _irods_version }}
            - irods-netcdf-*-{{ _irods_version }}.*
            - irods-resource-*-{{ _irods_version }}.*
          tags: skip_ansible_lint
# XXX - ^^^

        # The RPM irods-server needs irods-icommands but doesn't declare it as a dependency.
        - name: RedHat | install iRODS server
          ansible.builtin.dnf:
            name:
              - irods-icommands-{{ _irods_version }}
              - irods-server-{{ _irods_version }}
            state: present

        - name: RedHat | install OS specific required packages
          ansible.builtin.package:
            name: uuidd
            state: present

    - name: Provision Ubuntu
      when: ansible_distribution == 'Ubuntu'
      block:
        - name: Ubuntu | install iRODS package repository signing key
          ansible.builtin.apt_key:
            url: https://packages.irods.org/irods-signing-key.asc

        - name: Ubuntu | install iRODS repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/renci-irods.list
            mode: u+rw
            content: |
              deb [arch=amd64] https://packages.irods.org/apt/ {{ ansible_lsb.codename }} main

        - name: Ubuntu | update apt cache
          ansible.builtin.apt:
            update_cache: true
          tags:
            - non_idempotent

        - name: Ubuntu | lock iRODS packages to required version
          ansible.builtin.copy:
            dest: /etc/apt/preferences.d/irods
            mode: u+rw
            content: |
              Package: irods-resource-*
              Pin: version {{ _irods_version }}.*
              Pin-Priority: 1001

              Package: irods-*
              Pin: version {{ _irods_version }}-*
              Pin-Priority: 1001

        - name: Ubuntu | install iRODS server
          ansible.builtin.apt:
            name: irods-server
            state: present

        - name: Ubuntu | install OS specific required packages
          ansible.builtin.package:
            name:
              - debianutils
              - uuid-runtime
            state: present

    - name: Install optional iRODS modules
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      notify: Restart iRODS if needed
      loop:
        - irods-netcdf-client_modules
        - irods-netcdf-icommands
        - irods-netcdf-server_modules
        - irods-resource-plugin-s3

    - name: Ensure iRODS attempts to start on boot
      ansible.builtin.service:
        name: irods
        enabled: true
      tags: no_testing

    - name: Create service group
      ansible.builtin.group:
        name: "{{ _irods_service_group_name }}"
        system: true

    - name: Create service account
      ansible.builtin.user:
        name: "{{ _irods_service_account_name }}"
        system: true
        home: /var/lib/irods
        createhome: true
        group: "{{ _irods_service_group_name }}"
        groups: tty
        shell: /bin/bash
        comment: iRODS Administrator

    - name: Ensure iRODS ownership
      ansible.builtin.import_tasks: tasks/irods/ensure_irods_ownership.yml

  handlers:
    - name: Restart iRODS if needed
      when: _irods_restart_allowed
      ansible.builtin.include_tasks: tasks/irods/restart.yml
      vars:
        restart_op: if running


- name: Update /etc/hosts
  ansible.builtin.import_playbook: irods_hosts.yml
