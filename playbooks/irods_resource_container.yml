---
- name: Prepare docker repository
  hosts: irods_resource_container
  become: true
  vars_files:
    - vars/irods_resource_cfg.yml
  pre_tasks:
    - name: Check the release's rule bases
      ansible.builtin.import_tasks: tasks/irods/check_release_rulebases.yml

    - name: Require the service group to be named after the service account
      ansible.builtin.assert:
        that:
          - _irods_service_group_name == _irods_service_account_name
        fail_msg: >-
          The resource server image gives its irods group the host account's GID, so the service
          group must be the account's own group, {{ _irods_service_account_name }}.

    - name: Require an absolute vault path
      ansible.builtin.assert:
        that:
          - _irods_default_vault is string and _irods_default_vault is match('/')
        fail_msg: >-
          The resource server's container bind mounts its vault from the host, so irods_default_vault
          must be set to an absolute path.

    - name: Enable notifications
      ansible.builtin.set_fact:
        _enable_notifications: true

    - name: Set up Docker repository on AlmaLinux
      when: ansible_distribution == 'AlmaLinux'
      block:
        - name: Install DNF core plugins
          ansible.builtin.package:
            name: dnf-plugins-core

        - name: Add Docker repository
          ansible.builtin.command:
            cmd: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
            creates: /etc/yum.repos.d/docker-ce.repo

    - name: Set up Docker repository on Ubuntu
      when: ansible_distribution == 'Ubuntu'
      block:
        - name: Ensure keyrings folder exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: a+rx

        - name: Install docker repo key
          ansible.builtin.uri:
            url: https://download.docker.com/linux/ubuntu/gpg
            status_code:
              - 200
              - 304
            dest: /etc/apt/keyrings/docker.asc
            mode: a+r

        - name: Get dpkg architecture
          ansible.builtin.command: dpkg --print-architecture
          changed_when: false
          register: dpkg_resp

        - name: Install docker repo source
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/docker.list
            content: >
              deb [arch={{ dpkg_resp.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
            mode: a+r
          notify: Update apt cache

  tasks:
    - name: Update package cache on AlmaLinux hosts
      when: ansible_distribution == 'AlmaLinux'
      ansible.builtin.dnf:
        update_cache: true

    - name: Update stale apt cache
      when: ansible_distribution == 'Ubuntu'
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - logrotate
          - rsyslog

    - name: Ensure rsyslog is running
      ansible.builtin.service:
        name: rsyslog
        enabled: true
        state: started

    - name: Configure docker daemon for syslog
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "syslog",
            "log-opts": {
              "tag": {% raw %}"docker-{{.Name}}"{% endraw %}
            }
          }
        mode: u+r
      notify: Restart docker

    - name: Ensure docker is running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

  post_tasks:
    - name: Create iRODS user
      ansible.builtin.user:
        name: "{{ _irods_service_account_name }}"
        comment: iRODS Administrator
        system: true
        home: /var/lib/irods
        create_home: true
        shell: /bin/bash
        append: true
        groups:
          - docker

    - name: Create iRODS configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ _irods_service_account_name }}"
        group: "{{ _irods_service_group_name }}"
        mode: u+rwx
      loop:
        - "{{ _irods_default_vault }}"
        - /etc/irods
        - /var/lib/irods/.irods

    # The container mounts this read-only, but irods_cfg.yml protects it from the service account
    # anyway, and the two playbooks have to agree.
    - name: Create the command script directory
      ansible.builtin.file:
        path: /var/lib/irods/msiExecCmd_bin
        state: directory
        owner: root
        group: "{{ _irods_service_group_name }}"
        mode: go-w,g+rx

    - name: Deploy the command scripts
      ansible.builtin.import_tasks: tasks/irods/deploy_cmd_scripts.yml

    - name: Add irodsctl adapter
      ansible.builtin.copy:
        src: files/irods/docker-rs/irodsctl
        dest: /var/lib/irods/irodsctl
        owner: "{{ _irods_service_account_name }}"
        group: "{{ _irods_service_group_name }}"
        mode: u+rx

    - name: Copy required iRODS runtime config files
      ansible.builtin.copy:
        src: files/irods/docker-rs/run/etc/irods/{{ item }}
        dest: /etc/irods
        owner: "{{ _irods_service_account_name }}"
        group: "{{ _irods_service_group_name }}"
        mode: u+r
      loop:
        - core.dvm
        - core.fnm

    - name: Generate core.re
      ansible.builtin.template:
        src: templates/irods/docker-rs/run/etc/irods/core.re.j2
        dest: /etc/irods/core.re
        owner: "{{ _irods_service_account_name }}"
        group: "{{ _irods_service_group_name }}"
        mode: u+r

    # irods_cfg.yml configures these servers too, with the same settings. The running container
    # only picks up a change when it restarts.
    - name: Generate iRODS config files
      ansible.builtin.import_role:
        name: cyverse.ds.irods_cfg
      vars:
        irods_cfg_restart_allowed: true

    - name: Add build dir
      ansible.builtin.file:
        path: /var/lib/irods/build
        state: directory
        owner: "{{ _irods_service_account_name }}"
        group: "{{ _irods_service_group_name }}"
        mode: u+rx

    - name: Copy resource server image source
      ansible.builtin.copy:
        src: files/irods/docker-rs/build/{{ item }}
        dest: /var/lib/irods/build
        owner: "{{ _irods_service_account_name }}"
        group: "{{ _irods_service_group_name }}"
        mode: u+r
      register: rs_image_src
      loop:
        - entrypoint.sh
        - Dockerfile

    - name: Get service account info
      ansible.builtin.getent:
        database: passwd
        key: "{{ _irods_service_account_name }}"

    # The image gives its irods account these IDs, so it can use what the host account owns.
    - name: Set irods user uid and gid
      ansible.builtin.set_fact:
        _irods_host_gid: "{{ getent_passwd[_irods_service_account_name][2] }}"
        _irods_host_uid: "{{ getent_passwd[_irods_service_account_name][1] }}"

    - name: Generate .env file
      ansible.builtin.template:
        src: templates/irods/docker-rs/env.j2
        dest: /var/lib/irods/.env
        owner: "{{ _irods_service_account_name }}"
        group: "{{ _irods_service_group_name }}"
        mode: u+r
      register: rs_dotenv

    - name: Copy docker-compose.yml file
      ansible.builtin.copy:
        src: files/irods/docker-rs/docker-compose.yml
        dest: /var/lib/irods/docker-compose.yml
        owner: "{{ _irods_service_account_name }}"
        group: "{{ _irods_service_group_name }}"
        mode: u+r
      register: rs_compose_file

    - name: Configure rsyslog for iRODS
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/00-irods.conf
        content: |
          $FileCreateMode 0644
          $DirCreateMode 0755
          $Umask 0000
          $template irods_format,"%msg%\n"
          :programname,startswith,"docker-cyverse-irods" /var/log/irods/irods.log;irods_format
          & stop
        mode: u+r
      register: rsyslog_resp

    # The container's first start has to log through this configuration.
    - name: Load the rsyslog configuration for iRODS
      when: rsyslog_resp is changed
      ansible.builtin.service:
        name: rsyslog
        state: restarted

    - name: Configure log rotations for iRODS
      ansible.builtin.template:
        src: irods/etc/logrotate.d/irods.j2
        dest: /etc/logrotate.d/irods
        mode: u+r

    # Otherwise, a changed image source, .env or compose file would start the container from the old
    # image with the new configuration.
    - name: Start docker image
      community.docker.docker_compose_v2:
        project_src: /var/lib/irods
        build: >-
          {{ 'always'
            if rs_image_src is changed or rs_dotenv is changed or rs_compose_file is changed
            else 'policy' }}
        pull: never

  handlers:
    - name: Restart docker
      when: _enable_notifications | d(false)
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
