- name: Test update resource free space
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verify resource free space set
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          iinit <<< password > /dev/null
          if ! freeSpace="$(iquest '%s' "select RESC_FREE_SPACE where RESC_NAME = '{{ item }}'")"
          then
            exit 1
          fi
          test -n "$freeSpace"
      changed_when: false
      loop:
        - avra
        - esiilRes
        - ingestRes
        - ncemsRes
        - pire
        - replRes


- name: Test update resource free space for a missing resource
  hosts: dstesting-provider_configured-1.dstesting_default
  gather_facts: false
  vars_files:
    - ../group_vars/all/irods.yml
  tasks:
    - name: Verify a missing resource is reported
      block:
        - name: Update the free space of a missing resource
          ansible.builtin.include_tasks: ../tasks/irods/set_resc_free_space.yml
          vars:
            resource_name: noSuchResc
            vault_path: /tmp

        - name: Fail because the missing resource wasn't reported
          ansible.builtin.fail:
            msg: set_resc_free_space.yml accepted a missing resource
      rescue:
        - name: Verify the missing resource message
          ansible.builtin.assert:
            that:
              - estimate.stderr is search('Resource noSuchResc does not exist')
