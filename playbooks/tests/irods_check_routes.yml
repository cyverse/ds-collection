---
- name: Test the servers are left as they were found
  hosts: irods
  become: true
  tasks:
    # The async wrapper polls its finished receiver every 5 seconds, so it can briefly outlive it.
    - name: Verify no port check receiver is left running
      ansible.builtin.command: pgrep --full port_check_receiver
      register: resp
      changed_when: false
      failed_when: resp.rc != 1
      until: resp.rc == 1
      retries: 2
      delay: 5

    # The playbook can run before iRODS is installed, so only a configured server must be running.
    - name: Check for an iRODS server configuration
      ansible.builtin.stat:
        path: /etc/irods/server_config.json
      register: server_config

    - name: Verify configured iRODS servers are running
      when: server_config.stat.exists
      become_user: irods
      ansible.builtin.import_tasks: tasks/irods/test_running.yml
