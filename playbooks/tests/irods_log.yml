---
- name: Test install and configure rsyslog for iRODS
  hosts: irods
  become: true
  tasks:
    - name: Test install rsyslog
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      vars:
        pkg: rsyslog

    - name: Retrieve encoded rsyslog configuration
      ansible.builtin.slurp:
        src: /etc/rsyslog.d/00-irods.conf
      register: rsyslog_encoded

    - name: Test configure for iRODS
      vars:
        rsyslog: "{{ rsyslog_encoded.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - rsyslog is search('^\$template irods_format,"%msg%\\\\n"$', multiline=true)
          - >-
            rsyslog is search(
              '^:programname,startswith,"' ~ item ~ '" /var/log/irods/irods.log;irods_format\n& stop$',
              multiline=true )
      loop:
        - irodsServer
        - irodsDelayServer
        - irodsAgent

    - name: Test configure log rotations for iRODS
      ansible.builtin.import_tasks: tasks/irods/test_logrotate.yml
