---
- name: Test the WebDAV services are stopped and disabled
  hosts: webdav
  become: true
  tasks:
    - name: Test the WebDAV services are stopped and disabled
      ansible.builtin.include_tasks: tasks/test_services.yml
      vars:
        services:
          - httpd
          - purgeman
          - varnish
          - varnishncsa
        active: false
        enabled: false
