---
- name: Test the WebDAV services are stopped and disabled
  hosts: webdav
  become: true
  tasks:
    - name: Test {{ item }} is stopped and disabled
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          [[ "$(systemctl is-active '{{ item }}')" == inactive ]] \
            && [[ "$(systemctl is-enabled '{{ item }}')" == disabled ]]
      changed_when: false
      loop:
        - httpd
        - purgeman
        - varnish
        - varnishncsa
