---
# Run with -S webdav,webdav_stop. webdav.yml's handlers leave the services running, so without
# webdav_stop the running check can't fail.
- name: Test the WebDAV services are running and enabled
  hosts: webdav
  become: true
  tasks:
    - name: Test the WebDAV services are running and enabled
      ansible.builtin.include_tasks: tasks/webdav/test_services.yml
      vars:
        active: true
        enabled: true
