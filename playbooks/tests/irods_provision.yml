---
- name: Test provision for iRODS
  hosts: irods:!unmanaged_systems
  become: true
  vars_files:
    - ../group_vars/all/irods.yml
  vars:
    group_name: >-
      {{ 'irods_provider' if inventory_hostname in groups['irods_catalog'] else 'irods' }}
  tasks:
    - name: Test RedHat family provisioning
      when: ansible_os_family == 'RedHat'
      block:
        - name: RedHat | test install iRODS package repository signing key
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o pipefail
              rpm --query --queryformat='%{SUMMARY}\n' gpg-pubkey | grep --quiet 'iRODS Consortium'
          changed_when: false

        - name: RedHat | test install iRODS repository
          ansible.builtin.stat:
            path: /etc/yum.repos.d/renci-irods.yum.repo
          register: resp
          failed_when: not resp.stat.exists

        - name: RedHat | test lock irods package to required version
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o pipefail
              if ! yum versionlock list \
                | grep --quiet '^{{ item }}-0:{{ _irods_version | regex_escape }}[.-]'
              then
                printf '{{ item }} not locked to {{ _irods_version }}\n' >&2
                exit 1
              elif info="$(yum --quiet list installed '{{ item }}' | tail --lines=+2)"; then
                readarray -t versions <<< "$info"
                for version in "${versions[@]}"; do
                  read _ verNum _ <<< "$version"
                  if ! [[ "$verNum" =~ {{ _irods_version | regex_escape }} ]]; then
                    printf 'found version %s\n' "$verNum" >&2
                    exit 1
                  fi
                done
              fi
          changed_when: false
          when: _irods_netcdf_supported or item not in _irods_netcdf_packages
          loop:
            - irods-icommands
            - irods-netcdf-client_modules
            - irods-netcdf-icommands
            - irods-netcdf-server_modules
            - irods-resource-plugin-s3
            - irods-runtime
            - irods-server

        # irods_provision.yml removes a stale lock only if its line matches this copy of its pattern.
        - name: RedHat | test irods package locks match the stale lock pattern
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o pipefail
              readarray -t locks < <(yum versionlock list | sed --quiet '/^irods-/p')
              if [[ -z "${locks[0]-}" ]]; then
                printf 'no irods package locks\n' >&2
                exit 1
              fi
              for lock in "${locks[@]}"; do
                if ! [[ "$lock" =~ ^(irods-.+)-0:([0-9]+\.[0-9]+\.[0-9]+)[.-] ]]; then
                  printf 'lock %s does not match\n' "$lock" >&2
                  exit 1
                fi
              done
          changed_when: false

        - name: RedHat | verify correct packages installed
          ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
          loop:
            - irods-icommands
            - unixODBC
            - uuidd
          loop_control:
            loop_var: pkg

        - name: RedHat | verify chkconfig installed
          when: _irods_chkconfig_required
          ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
          vars:
            pkg: chkconfig

        - name: RedHat | verify /etc/init.d is chkconfig's link
          when: _irods_chkconfig_required
          ansible.builtin.stat:
            path: /etc/init.d
          register: resp
          failed_when: not resp.stat.islnk or resp.stat.lnk_target != 'rc.d/init.d'

    - name: Test Ubuntu provisioning
      when: ansible_distribution == 'Ubuntu'
      block:
        - name: Ubuntu | test install iRODS package repository signing key
          ansible.builtin.command: apt-key list
          register: resp
          changed_when: false
          failed_when: resp.stdout is not regex('iRODS Consortium')

        - name: Ubuntu | test install iRODS repository
          ansible.builtin.stat:
            path: /etc/apt/sources.list.d/renci-irods.list
          register: resp
          failed_when: not resp.stat.exists

        - name: Ubuntu | test update apt cache
          ansible.builtin.command: apt-cache policy
          register: resp
          changed_when: false
          failed_when: resp.stdout is not regex('packages.irods.org' | regex_escape)

        - name: Ubuntu | test lock iRODS packages to required version
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o pipefail
              apt-cache policy \
                | grep --quiet \
                  --regexp='{{ item }} -> {{ _irods_version | regex_escape }}\([.-].*\)\? with priority 1001'
          changed_when: false
          loop:
            - irods-resource-plugin-s3
            - irods-server
          tags: skip_ansible_lint

        - name: Ubuntu | verify correct packages installed
          ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
          loop:
            - debianutils
            - uuid-runtime
          loop_control:
            loop_var: pkg

    - name: Determine which packages are installed
      when: not _irods_netcdf_supported
      ansible.builtin.package_facts:

    - name: Verify the NetCDF modules are absent
      when: not _irods_netcdf_supported
      ansible.builtin.assert:
        that:
          - item not in ansible_facts.packages
      loop: "{{ _irods_netcdf_packages }}"

    - name: Verify iRODS server installed
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      vars:
        pkg: irods-server
        ver: "{{ _irods_version }}"

    - name: Verify iRODS S3 resource plugin installed
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      vars:
        pkg: irods-resource-plugin-s3
        # Plugin releases add a fourth number to the iRODS release they're built for.
        ver_prefix: "{{ _irods_version }}"

    - name: Test create service group
      ansible.builtin.command:
        cmd: sed --quiet 's/^{{ group_name }}:x:\([0-9]\+\):.*/\1/p' /etc/group
      register: gid_resp
      changed_when: false
      failed_when: gid_resp.stdout | length == 0
      tags: skip_ansible_lint

    - name: Verify that the system user has correct comment
      ansible.builtin.command:
        cmd: >
          grep --quiet --regexp
            '^irods:x:[0-9]*:{{ gid_resp.stdout }}:iRODS Administrator:/var/lib/irods:/bin/bash'
            /etc/passwd
      changed_when: false

    - name: Verify that system user belongs to tty group
      ansible.builtin.command:
        cmd: grep --quiet --regexp '^tty:x:[0-9]*:\(.\+,\)\?irods\(,.\+\)\?$' /etc/group
      changed_when: false

    - name: Verify iRODS ownership
      ansible.builtin.include_tasks: tasks/irods/test_irods_ownership.yml
      loop:
        - /etc/irods
        - /var/lib/irods
      loop_control:
        loop_var: dir
