---
# Run with -S sftp,sftp_stop. sftp.yml's handlers leave sftpgo running, so without sftp_stop
# the running check can't fail.
- name: Test the SFTP services are running and enabled
  hosts: sftp
  become: true
  tasks:
    - name: Test the SFTP services are running and enabled
      ansible.builtin.include_tasks: tasks/test_services.yml
      vars:
        services:
          - sftpgo
        active: true
        enabled: true
