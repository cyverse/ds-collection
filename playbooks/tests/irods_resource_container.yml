---
# REQUIREMENTS:
#  inventory: hosts-all

- name: Test default template expansions
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/irods.yml
  vars:
    _irods_host_gid: 999
    _irods_host_uid: 999
    core: "{{ lookup('template', '../templates/irods/docker-rs/run/etc/irods/core.re.j2') }}"
    env: "{{ lookup('template', '../templates/irods/docker-rs/env.j2') }}"
    logrotate: "{{ lookup('template', '../templates/irods/etc/logrotate.d/irods.j2') }}"
  tasks:
    - name: Test core.re expansion
      ansible.builtin.assert:
        that:
          - core is search('# Ansible managed')
          - core is search('acSetRescSchemeForCreate { msiSetDefaultResc("demoResc"' | regex_escape)
          - core is search('acSetRescSchemeForRepl { msiSetDefaultResc("demoResc"' | regex_escape)

    - name: Test .env expansion
      ansible.builtin.assert:
        that:
          - env is search('Ansible managed')
          - >-
            env is search(
              '^IRODS_CATALOG_PROVIDER=' ~ (groups['irods_catalog'][0] | regex_escape) ~ '$',
              multiline=true )
          - env is search('^IRODS_HOST_GID=999$', multiline=true)
          - env is search('^IRODS_HOST_UID=999$', multiline=true)
          - >-
            env is search(
              '^IRODS_NETCDF_PACKAGES='
                ~ (
                  'irods-netcdf-client_modules irods-netcdf-icommands irods-netcdf-server_modules'
                    if _irods_version is version('4.3.2', '<') else '' )
                ~ '$',
              multiline=true )
          - env is search('^IRODS_SERVER_PORT_RANGE_START=20000$', multiline=true)
          - env is search('^IRODS_SERVER_PORT_RANGE_END=20199$', multiline=true)
          - env is search('^IRODS_USER_PASSWORD=rods$', multiline=true)
          - env is search('^IRODS_VERSION=' ~ (_irods_version | regex_escape) ~ '$', multiline=true)
          - env is search('^IRODS_ZONE_PORT=1247$', multiline=true)

    - name: Test logrotate.d/irods expansion
      ansible.builtin.assert:
        that:
          - logrotate is search('Ansible managed')
          - logrotate is search('^/var/log/irods/irods.log {$', multiline=true)
          - logrotate is search('^\s+rotate 26$', multiline=true)

- name: Test custom template expansions
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/irods.yml
  vars:
    irods_clerver_password: custom_password
    irods_default_repl_resource: customReplRes
    irods_default_resource: customRes
    irods_default_vault: /custom/vault
    irods_log_retention: 4
    irods_server_port_range_end: 30099
    irods_server_port_range_start: 30000
    irods_zone_name: customZone
    _irods_host_gid: 4321
    _irods_host_uid: 1234
    core: "{{ lookup('template', '../templates/irods/docker-rs/run/etc/irods/core.re.j2') }}"
    env: "{{ lookup('template', '../templates/irods/docker-rs/env.j2') }}"
    logrotate: "{{ lookup('template', '../templates/irods/etc/logrotate.d/irods.j2') }}"
  tasks:
    - name: Test core.re expansion
      ansible.builtin.assert:
        that:
          - core is search('acSetRescSchemeForCreate { msiSetDefaultResc("customRes"' | regex_escape)
          - core is search('acSetRescSchemeForRepl { msiSetDefaultResc("customReplRes"' | regex_escape)

    - name: Test .env expansion
      ansible.builtin.assert:
        that:
          - env is search('^IRODS_HOST_GID=4321$', multiline=true)
          - env is search('^IRODS_HOST_UID=1234$', multiline=true)
          - env is search('^IRODS_SERVER_PORT_RANGE_START=30000$', multiline=true)
          - env is search('^IRODS_SERVER_PORT_RANGE_END=30099$', multiline=true)
          - env is search('^IRODS_USER_PASSWORD=custom_password$', multiline=true)
          - env is search('^IRODS_VAULT_PATH=/custom/vault$', multiline=true)
          - env is search('^IRODS_ZONE_NAME=customZone$', multiline=true)

    - name: Test logrotate.d/irods expansion
      ansible.builtin.assert:
        that:
          - logrotate is search('^\s+rotate 4$', multiline=true)

- name: Test prepare docker repository
  hosts: irods_resource_container
  # The rule base templates need these to be rendered for comparison
  vars_files:
    - ../group_vars/all/avra.yml
    - ../group_vars/all/esiil.yml
    - ../group_vars/all/irods.yml
    - ../group_vars/all/ncems.yml
    - ../group_vars/all/pire.yml
  tasks:
    - name: Test set up docker repository on AlmaLinux
      when: ansible_distribution == 'AlmaLinux'
      block:
        - name: Test install DNF core plugins
          ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
          vars:
            pkg: dnf-plugins-core

        - name: Test add Docker repository
          ansible.builtin.stat:
            path: /etc/yum.repos.d/docker-ce.repo
          register: resp
          failed_when: not resp.stat.exists

    - name: Test set up docker repository on Ubuntu
      when: ansible_distribution == 'Ubuntu'
      block:
        - name: Test ensure keyrings folder exists
          ansible.builtin.stat:
            path: /etc/apt/keyrings
          register: resp
          failed_when: >
            not resp.stat.exists
            or not resp.stat.isdir
            or not (resp.stat.rusr and resp.stat.rgrp and resp.stat.roth)
            or not (resp.stat.xusr and resp.stat.xgrp and resp.stat.xoth)

        - name: Test install docker repo key
          ansible.builtin.stat:
            path: /etc/apt/keyrings/docker.asc
          register: resp
          failed_when: >
            not (resp.stat.exists and resp.stat.rusr and resp.stat.rgrp and resp.stat.roth)

        - name: Test docker repo source exists
          ansible.builtin.stat:
            path: /etc/apt/sources.list.d/docker.list
          register: resp
          failed_when: >
            not (resp.stat.exists and resp.stat.rusr and resp.stat.rgrp and resp.stat.roth)

        - name: Retrieve encoded docker.list
          ansible.builtin.slurp:
            src: /etc/apt/sources.list.d/docker.list
          register: d_encoded

        - name: Decode docker.list
          ansible.builtin.set_fact:
            docker: "{{ d_encoded.content | b64decode }}"

        - name: Test docker repo source contents
          ansible.builtin.assert:
            that:
              - docker is regex('arch=amd64')
              - docker is regex(' noble stable')

    - name: Test install required packages
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - logrotate
        - rsyslog
      loop_control:
        loop_var: pkg

    - name: Test configure docker daemon for syslog
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: resp
      failed_when: not (resp.stat.exists and resp.stat.rusr)

    - name: Retrieve encoded daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: d_encoded

    - name: Decode daemon.json
      ansible.builtin.set_fact:
        daemon: "{{ d_encoded.content | b64decode }}"

    - name: Define expected tag value
      ansible.builtin.set_fact:
        exp_tag: '{{ "{% raw %}docker-{{.Name}}{% endraw %}" }}'

    - name: Test contents of docker/daemon.json
      ansible.builtin.assert:
        that: daemon['log-opts']['tag'] == exp_tag

    - name: Verify iRODS group exists
      ansible.builtin.group:
        name: irods
      check_mode: true
      register: group_resp
      failed_when: group_resp.state != 'present' or group_resp.gid >= 1000

    - name: Test create iRODS user
      ansible.builtin.user:
        name: irods
      check_mode: true
      register: resp
      failed_when: >-
        resp.state != 'present'
        or resp.comment != 'iRODS Administrator'
        or resp.group != group_resp.gid
        or resp.home != '/var/lib/irods'
        or resp.shell != '/bin/bash'
        or resp.uid >= 1000

    - name: Verify iRODS user belongs to Docker group
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          for group in $(groups irods | sed 's/^irods : //'); do
            if [[ "$group" == docker ]]; then
              exit 0
            fi
          done
          exit 1
      changed_when: false

    - name:  Test create iRODS directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: resp
      failed_when: >
        not resp.stat.exists
        or not resp.stat.isdir
        or not (resp.stat.pw_name == 'irods' and resp.stat.gr_name == 'irods')
        or not (resp.stat.rusr and resp.stat.wusr and resp.stat.xusr)
      loop:
        - /etc/irods
        - "{{ irods_default_vault }}"
        - /var/lib/irods
        - /var/lib/irods/.irods

    - name: Test the command scripts are protected
      ansible.builtin.import_tasks: tasks/irods/test_cmd_scripts_protected.yml

    - name: Test add irodsctl adapter
      ansible.builtin.stat:
        path: /var/lib/irods/irodsctl
      register: resp
      failed_when: >
        not resp.stat.exists
        or not (resp.stat.pw_name == 'irods' and resp.stat.gr_name == 'irods')
        or not (resp.stat.rusr and resp.stat.xusr)

    - name: Test required iRODS runtime config files copied
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/irods/docker-rs/run/etc/irods/{{ item }}"
        dest: /etc/irods/{{ item }}
        owner: irods
        group: irods
        mode: u+r
      check_mode: true
      register: resp
      failed_when: resp is changed or resp is failed
      loop:
        - core.dvm
        - core.fnm

    - name: Test generate core.re
      ansible.builtin.stat:
        path: /etc/irods/core.re
      register: resp
      failed_when: >-
        not resp.stat.exists
        or not (resp.stat.pw_name == 'irods' and resp.stat.gr_name == 'irods')
        or not resp.stat.rusr

    - name: Retrieve encoded core.re
      ansible.builtin.slurp:
        src: /etc/irods/core.re
      register: core_encoded

    - name: Test core.re contents
      ansible.builtin.assert:
        that:
          - core is search('acSetRescSchemeForCreate { msiSetDefaultResc("ingestRes"' | regex_escape)
          - core is search('acSetRescSchemeForRepl { msiSetDefaultResc("replRes"' | regex_escape)
      vars:
        core: "{{ core_encoded.content | b64decode }}"

    - name: Test add command scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /var/lib/irods/msiExecCmd_bin/{{ item | basename }}
        owner: root
        group: irods
        mode: u+rx,g+rx,go-w
      check_mode: true
      register: resp
      failed_when: resp is changed or resp is failed
      with_fileglob: ../files/irods/var/lib/irods/msiExecCmd_bin/*

    - name: Test stage dynamic rule bases
      ansible.builtin.slurp:
        src: /etc/irods/{{ item | basename | regex_replace('\.j2$') }}
      register: resp
      failed_when: >-
        resp is failed
        or (resp.content | b64decode | trim) != (lookup('template', item) | trim)
      with_fileglob: ../templates/irods/etc/irods/*

    - name: Test stage static rule bases
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/irods/{{ item | basename }}
        owner: irods
        group: irods
        mode: u+r
      check_mode: true
      register: resp
      failed_when: resp is changed or resp is failed
      with_fileglob: ../files/irods/etc/irods/*

    - name: Verify the iRODS release's rule bases are in place
      ansible.builtin.import_tasks: tasks/irods/test_release_rulebases.yml

    - name: Verify service_account.config deposition
      ansible.builtin.stat:
        path: /etc/irods/service_account.config
      register: resp
      failed_when: not resp.stat.exists

    - name: Retrieve encoded service_account.config
      ansible.builtin.slurp:
        src: /etc/irods/service_account.config
      register: sa_encoded

    - name: Decode service_account.config
      ansible.builtin.set_fact:
        service_account: "{{ sa_encoded.content | b64decode }}"

    - name: Verify contents of service_account.config
      ansible.builtin.assert:
        that:
          - service_account is search('\nIRODS_SERVICE_ACCOUNT_NAME=irods\n')
          - service_account is search('\nIRODS_SERVICE_GROUP_NAME=irods\n')

    - name: Verify deposition of server_config.json
      ansible.builtin.stat:
        path: /etc/irods/server_config.json
      register: response
      failed_when: not response.stat.exists

    - name: Retrieve encoded server_config.json
      ansible.builtin.slurp:
        src: /etc/irods/server_config.json
      register: sc_encoded

    - name: Decode server_config.json
      ansible.builtin.set_fact:
        server_config: "{{ sc_encoded.content | b64decode }}"

    - name: Verify server_config.json
      vars:
        rule_lang: "{{ server_config.plugin_configuration.rule_engines[0] }}"
      ansible.builtin.assert:
        that:
          - server_config.advanced_settings.default_number_of_transfer_threads == 4
          - server_config.advanced_settings.number_of_concurrent_delay_rule_executors == 4
          - server_config.advanced_settings.transfer_buffer_size_for_parallel_transfer_in_megabytes == 4
          - server_config.catalog_provider_hosts == groups['irods_catalog']
          - server_config.catalog_service_role == 'consumer'
          - server_config.default_dir_mode == '0750'
          - server_config.default_file_mode == '0600'
          - server_config.default_hash_scheme == 'MD5'
          - server_config.host_resolution.host_entries == []
          - server_config.negotiation_key == 'TEMPORARY_32byte_negotiation_key'
          - server_config.plugin_configuration.rule_engines | length == 2
          - rule_lang.plugin_name == 'irods_rule_engine_plugin-irods_rule_language'
          - >-
            rule_lang.plugin_specific_configuration.re_rulebase_set
            == ['cve', 'cyverse_core', 'cyverse_housekeeping', 'core']
          - >-
            rule_lang.plugin_specific_configuration.regexes_for_supported_peps
            == ['ac[^ ]*', 'msi[^ ]*', '[^ ]*pep_[^ ]*_(pre|post|except|finally)']
          - rule_lang.shared_memory_instance == 'irods_rule_language_rule_engine'
          - >-
            server_config.plugin_configuration.rule_engines[1].plugin_name
            == 'irods_rule_engine_plugin-cpp_default_policy'
          - server_config.schema_validation_base_uri == 'file:///var/lib/irods/configuration_schemas'
          - server_config.server_control_plane_key == 'TEMPORARY__32byte_ctrl_plane_key'
          - server_config.server_port_range_end == 20009
          - server_config.server_port_range_start == 20000
          - server_config.zone_key == 'TEMPORARY_zone_key'
          - server_config.zone_name == 'testing'
          - server_config.zone_user == 'rods'

    - name: Retrieve encoded irods_environment.json
      ansible.builtin.slurp:
        src: /var/lib/irods/.irods/irods_environment.json
      register: env_encoded

    - name: Verify irods_environment.json
      vars:
        irods_env: "{{ env_encoded.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - irods_env.irods_authentication_file is undefined
          - irods_env.irods_default_resource == 'ingestRes'
          - irods_env.irods_host == inventory_hostname
          - irods_env.irods_port == 1247
          - irods_env.irods_server_control_plane_key == 'TEMPORARY__32byte_ctrl_plane_key'
          - irods_env.irods_user_name == 'rods'
          - irods_env.irods_zone_name == 'testing'

    - name: Test add build dir
      ansible.builtin.stat:
        path: /var/lib/irods/build
      register: resp
      failed_when: >-
        not resp.stat.exists
        or not resp.stat.isdir
        or not (resp.stat.pw_name == 'irods' and resp.stat.gr_name == 'irods')
        or not (resp.stat.rusr and resp.stat.xusr)

    - name: Test copy resource server image source
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/irods/docker-rs/build/{{ item }}"
        dest: /var/lib/irods/build/{{ item }}
        owner: irods
        group: irods
        mode: u+r
      check_mode: true
      register: resp
      failed_when: resp is changed or resp is failed
      loop:
        - Dockerfile
        - entrypoint.sh

    - name: Get the service account's UID
      ansible.builtin.getent:
        database: passwd
        key: irods

    - name: Retrieve encoded .env
      ansible.builtin.slurp:
        src: /var/lib/irods/.env
      register: dotenv_encoded

    - name: Test placement of .env file
      vars:
        dotenv: "{{ dotenv_encoded.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - >-
            dotenv is search(
              '^IRODS_CATALOG_PROVIDER=' ~ (groups['irods_catalog'][0] | regex_escape) ~ '$',
              multiline=true )
          - dotenv is search('^IRODS_HOST_GID=' ~ getent_passwd.irods[2] ~ '$', multiline=true)
          - dotenv is search('^IRODS_HOST_UID=' ~ getent_passwd.irods[1] ~ '$', multiline=true)
          - dotenv is search('^IRODS_SERVER_PORT_RANGE_START=20000$', multiline=true)
          - dotenv is search('^IRODS_SERVER_PORT_RANGE_END=20009$', multiline=true)
          - dotenv is search('^IRODS_USER_PASSWORD=password$', multiline=true)
          - dotenv is search('^IRODS_VAULT_PATH=/irods_vault/container$', multiline=true)
          - dotenv is search('^IRODS_ZONE_NAME=testing$', multiline=true)
          - dotenv is search('^IRODS_ZONE_PORT=1247$', multiline=true)

    - name: Test copy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/irods/docker-rs/docker-compose.yml"
        dest: /var/lib/irods/docker-compose.yml
        owner: irods
        group: irods
        mode: u+r
      check_mode: true
      register: resp
      failed_when: resp is changed or resp is failed

    - name: Retrieve encoded rsyslog configuration
      ansible.builtin.slurp:
        src: /etc/rsyslog.d/00-irods.conf
      register: rsyslog_encoded

    - name: Test configured rsyslog for iRODS
      vars:
        rsyslog: "{{ rsyslog_encoded.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - >-
            rsyslog is search(
              '^:programname,startswith,"docker-cyverse-irods" /var/log/irods/irods.log;irods_format\n& stop$',
              multiline=true )

    - name: Test log rotation config placement for iRODS
      ansible.builtin.import_tasks: tasks/irods/test_logrotate.yml

- name: Test the irodsctl adapter
  hosts: irods_resource_container
  become: true
  become_user: irods
  gather_facts: false
  vars:
    compose: compose --file=/var/lib/irods/docker-compose.yml
  tasks:
    - name: Make a directory for the fake docker
      ansible.builtin.tempfile:
        state: directory
      register: fake_dir

    - name: Test the commands it sends to docker
      block:
        # It records its arguments, and its exec reports a running server unless told not to.
        - name: Add a fake docker
          ansible.builtin.copy:
            dest: "{{ fake_dir.path }}/docker"
            mode: u+rx
            content: |
              #!/usr/bin/env bash
              printf '%s\n' "$*" >> "$FAKE_DOCKER_LOG"
              if [[ "$*" == *' exec '* ]]; then
                if [[ -n "${FAKE_DOCKER_EXEC_FAILS-}" ]]; then
                  exit 1
                fi
                printf 'irodsServer :: Process 7\n'
              fi

        # The adapter's output goes to stderr and the calls to docker to stdout.
        - name: Test each command
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o nounset
              export FAKE_DOCKER_LOG='{{ fake_dir.path }}'/docker.log
              rm --force "$FAKE_DOCKER_LOG"
              PATH='{{ fake_dir.path }}':"$PATH" /var/lib/irods/irodsctl {{ item.args }} >&2
              rc=$?
              cat "$FAKE_DOCKER_LOG" 2> /dev/null
              exit "$rc"
          environment:
            FAKE_DOCKER_EXEC_FAILS: "{{ 'yes' if item.stopped | d(false) else '' }}"
          register: resp
          changed_when: false
          failed_when: >-
            resp.rc != item.rc
              or resp.stdout_lines != item.calls
              or resp.stderr is not search(item.out | d(''))
          loop_control:
            label: "{{ item.args }}{{ ' with the server stopped' if item.stopped | d(false) else '' }}"
          loop:
            - args: start
              rc: 0
              calls: ["{{ compose }} up --detach"]
            - args: stop
              rc: 0
              calls: ["{{ compose }} down"]
            - args: restart
              rc: 0
              calls: ["{{ compose }} restart"]
            # irods_ctl passes --test when the irods_cfg role's test logging is on.
            - args: --test start
              rc: 0
              calls: ["{{ compose }} up --detach"]
            - args: --test restart
              rc: 0
              calls: ["{{ compose }} restart"]
            - args: status
              rc: 0
              calls: ["{{ compose }} exec --user=irods irods-rs /var/lib/irods/irodsctl status"]
              out: irodsServer
            - args: status
              stopped: true
              rc: 0
              calls: ["{{ compose }} exec --user=irods irods-rs /var/lib/irods/irodsctl status"]
              out: No iRODS servers running
            - args: --help
              rc: 0
              calls: []
              out: Usage
            - args: ""
              rc: 1
              calls: []
              out: Usage
            - args: unknown
              rc: 1
              calls: []
              out: Usage
            - args: --unknown start
              rc: 1
              calls: []
              out: Usage

      always:
        - name: Remove the fake docker
          ansible.builtin.file:
            path: "{{ fake_dir.path }}"
            state: absent

- name: Test the running resource server
  hosts: irods_resource_container
  become: true
  become_user: irods
  gather_facts: false
  vars_files:
    - vars/irods_resource_container.yml
  vars:
    test_obj: /testing/home/rods/{{ inventory_hostname_short }}-test.dat
    test_resc: "{{ inventory_hostname_short }}-test"
  tasks:
    - name: Test the container is running
      ansible.builtin.command:
        argv: "{{ compose + ['ps', '--status=running', '--quiet', 'irods-rs'] }}"
      register: resp
      changed_when: false
      failed_when: resp is failed or resp.stdout == ''

    - name: Count the lines already in the host's iRODS log
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "{ wc --lines < /var/log/irods/irods.log; } 2> /dev/null || echo 0"
      register: log_lines
      changed_when: false

    - name: Restart the server through the adapter
      ansible.builtin.command: /var/lib/irods/irodsctl restart
      changed_when: true

    # The entrypoint logs this each time the container starts. grep stops at the first match, which
    # can kill tail with SIGPIPE, so tail isn't in a pipeline whose status counts.
    - name: Test the restarted server logs to the host's iRODS log
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          grep --quiet 'Starting server'
          <(tail --lines=+{{ log_lines.stdout | int + 1 }} /var/log/irods/irods.log)
      register: resp
      changed_when: false
      until: resp is succeeded
      retries: 15
      delay: 2

    # A server Docker has to kill after it ignores SIGTERM never logs this.
    - name: Test the server shut down cleanly for the restart
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          grep --quiet 'iRODS Server is done'
          <(tail --lines=+{{ log_lines.stdout | int + 1 }} /var/log/irods/irods.log)
      changed_when: false

    - name: Test the adapter reports the server running
      ansible.builtin.command: /var/lib/irods/irodsctl status
      register: resp
      changed_when: false
      until: resp.stdout is search('irodsServer')
      retries: 30
      delay: 2

    # The scripts are root's, so the container's irods account runs them through its group.
    # Unlike the rule below, which hides it, this shows the script's own error.
    - name: Test the server's account can run the command scripts
      ansible.builtin.command:
        argv: "{{ in_container + ['/var/lib/irods/msiExecCmd_bin/generate-uuid'] }}"
      register: resp
      changed_when: false
      failed_when: resp is failed or resp.stdout is not match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')

    - name: Test putting and getting data through a resource on the server
      block:
        # The server's processes start before it listens for connections.
        - name: Create a resource on the server once it answers
          ansible.builtin.import_tasks: tasks/irods/make_container_resource.yml
          vars:
            _container_resc: "{{ test_resc }}"
            _container_resc_vault: test

        - name: Test a put and a get through the server
          ansible.builtin.command:
            argv: "{{ in_container + ['bash', '-s', '--', test_resc, test_obj] }}"
            stdin: |
              set -o errexit -o nounset -o pipefail
              src="$(mktemp)"
              dest="$(mktemp)"
              trap 'rm --force "$src" "$dest"' EXIT
              head --bytes=100000 /dev/urandom > "$src"
              iput -K -R "$1" "$src" "$2"
              iget -f -K "$2" "$dest"
              cmp "$src" "$dest"
          changed_when: true

        # The container bind mounts the vault, so the data should be on the host, owned by irods.
        - name: Test the data is in the host's vault
          ansible.builtin.find:
            paths: "{{ irods_default_vault }}/test"
            patterns: "{{ test_obj | basename }}"
            recurse: true
          register: resp
          failed_when: resp.matched != 1 or resp.files[0].pw_name != 'irods'

        - name: Test the catalog provider can get the data from the server
          delegate_to: "{{ groups['irods_catalog'][0] }}"
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o errexit -o nounset
              dest="$(mktemp)"
              trap 'rm --force "$dest"' EXIT
              iget -f -K {{ test_obj | quote }} "$dest"
          changed_when: false

      always:
        # A failed put leaves no data object, and irm fails then.
        - name: Remove the test data object
          ansible.builtin.command:
            argv: "{{ in_container + ['irm', '-f', test_obj] }}"
          register: resp
          changed_when: resp.rc == 0
          failed_when: false

        - name: Remove the test resource
          ansible.builtin.command:
            argv: "{{ in_container + ['iadmin', 'rmresc', test_resc] }}"
          changed_when: true

    # irule runs the rule, and so its msiExecCmd of generate-uuid, on the server it connects to.
    - name: Test a Data Store rule on the server runs a command script
      ansible.builtin.command:
        argv: >-
          {{ compose
            + ['exec', '-T', '--user=irods', '--env=IRODS_HOST=' ~ inventory_hostname, 'irods-rs']
            + ['irule', '-r', 'irods_rule_engine_plugin-irods_rule_language-instance']
            + ['writeLine("stdout", _cyverse_logic_genUUID())', 'null', 'ruleExecOut'] }}
      register: resp
      changed_when: false
      failed_when: resp is failed or resp.stdout is not match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')

- name: Test the containerized resource servers' upgrade
  hosts: irods_resource_container
  become: true
  become_user: irods
  gather_facts: false
  vars_files:
    - ../group_vars/all/irods.yml
    - vars/irods_resource_container.yml
  tasks:
    # With --upgrade-from, the environment deploys these servers on that release and seeds them
    # before upgrading the others, so the playbook under test upgrades them.
    - name: Test the upgrade
      when: irods_upgrade_from is defined
      block:
        - name: Test the server runs the release it was upgraded to
          ansible.builtin.command:
            argv: "{{ in_container + ['dpkg-query', '--show', '--showformat=${Version}', 'irods-server'] }}"
          register: resp
          changed_when: false
          failed_when: resp is failed or resp.stdout is not match((_irods_version | regex_escape) ~ '-')

        - name: Test the release's own rule bases are in force
          ansible.builtin.import_tasks: tasks/irods/test_release_rules_in_force.yml
          vars:
            _irods_client_bash: "{{ in_container + ['bash'] }}"

        # The environment made the copies after upgrading the catalog provider, while the server
        # still ran the earlier release.
        - name: Read how the copies went while the releases were mixed
          become: true
          become_user: root
          ansible.builtin.slurp:
            src: "{{ mixed_results }}"
          register: mixed_resp

        - name: Test the copies worked while the releases were mixed
          ansible.builtin.assert:
            that: item.value.rc == 0
            fail_msg: The copy {{ item.key }} failed with {{ item.value.stderr }}
            quiet: true
          loop: "{{ mixed_resp.content | b64decode | from_json | dict2items }}"
          loop_control:
            label: the copy {{ item.key }}

        - name: Test the data from before the upgrade is intact on the server's resource
          ansible.builtin.command:
            argv: "{{ in_container + ['bash', '-s', '--', item.obj, upgrade_content, upgrade_resc] }}"
            stdin: |
              set -o errexit -o nounset -o pipefail
              dest="$(mktemp)"
              trap 'rm --force "$dest"' EXIT
              iget -f -K "$1" "$dest"
              [[ "$(< "$dest")" == "$2" ]]
              rescs="$(iquest '%s' \
                "select DATA_RESC_NAME where COLL_NAME = '${1%/*}' and DATA_NAME = '${1##*/}'")"
              [[ "$rescs" == "$3" ]]
          changed_when: false
          loop: "{{ upgrade_objs }}"
          loop_control:
            label: "{{ item.label }}"

      always:
        # One is missing when the upgrade lost it or a copy failed, and irm fails then.
        - name: Remove the upgrade test's data objects
          ansible.builtin.command:
            argv: "{{ in_container + ['irm', '-f', item] }}"
          register: resp
          changed_when: resp.rc == 0
          failed_when: false
          loop: "{{ upgrade_objs | map(attribute='obj') }}"

        - name: Remove the upgrade test's resource
          ansible.builtin.command:
            argv: "{{ in_container + ['iadmin', 'rmresc', upgrade_resc] }}"
          changed_when: true

- name: Record the iRODS configuration irods_resource_container.yml left
  hosts: irods_resource_container
  become: true
  gather_facts: false
  tasks:
    - name: Record the configuration files' and directories' owners, modes and contents
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: &record_cfg |
          set -o errexit -o pipefail
          dirs=(/etc/irods /var/lib/irods/.irods /var/lib/irods/msiExecCmd_bin)
          find "${dirs[@]}" -exec stat --format='%n %F %U:%G %a' {} + | sort
          find "${dirs[@]}" -type f -exec sha1sum {} + | sort
      register: cfg_before
      changed_when: false

# irods_cfg.yml configures every resource server, including the containerized ones.
- name: Configure the iRODS servers with irods_cfg.yml
  ansible.builtin.import_playbook: ../irods_cfg.yml

- name: Test irods_cfg.yml agrees with irods_resource_container.yml
  hosts: irods_resource_container
  become: true
  gather_facts: false
  vars_files:
    - vars/irods_resource_container.yml
  tasks:
    - name: Record the configuration files again
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: *record_cfg
      register: cfg_after
      changed_when: false

    - name: Test irods_cfg.yml left the configuration as it was
      ansible.builtin.assert:
        that: cfg_after.stdout == cfg_before.stdout
        fail_msg: >-
          irods_cfg.yml changed these files' or directories' owners, modes or contents:
          {{ cfg_before.stdout_lines | symmetric_difference(cfg_after.stdout_lines) }}
        quiet: true

    - name: Test the server still answers requests
      become: true
      become_user: irods
      ansible.builtin.command:
        argv: "{{ in_container + ['ils'] }}"
      register: resp
      changed_when: false
      until: resp is succeeded
      retries: 30
      delay: 2

# In check mode, the playbooks change nothing even if they miss the mismatch. With the limit, the
# only plays irods_upgrade.yml runs are its report on the containerized servers.
- name: Test irods_cfg.yml and irods_upgrade.yml check the release the containerized servers run
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/irods.yml
  vars:
    nested_run: [ansible-playbook, --check, "--inventory={{ ansible_inventory_sources | first }}",
      --limit=irods_resource_container, --skip-tags=no_testing]
    other_releases: >-
      {{ release_dirs.files | map(attribute='path') | map('basename')
        | reject('equalto', _irods_version) | sort | list }}
  tasks:
    # Each release with its own rule bases has a directory of them.
    - name: Find the releases with their own rule bases
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../files/irods/etc/irods"
        file_type: directory
      register: release_dirs

    - name: Test irods_cfg.yml fails for another release on every containerized server
      when: other_releases | length > 0
      ansible.builtin.command:
        argv: >-
          {{ nested_run
            + ['--extra-vars=irods_version=' ~ other_releases | first]
            + [playbook_dir ~ '/../irods_cfg.yml'] }}
      register: resp
      environment:
        ANSIBLE_STDOUT_CALLBACK: default
      changed_when: false
      failed_when: >-
        resp.rc == 0
        or resp.stdout
          | regex_findall('image is for iRODS ' ~ (_irods_version | regex_escape) ~ ',')
          | length != groups['irods_resource_container'] | length

    # Only the report needs the release, so these needn't have rule bases.
    - name: Test irods_upgrade.yml reports every containerized server on an earlier release
      ansible.builtin.command:
        argv: "{{ nested_run + ['--extra-vars=irods_version=999.0.0', playbook_dir ~ '/../irods_upgrade.yml'] }}"
      register: resp
      environment:
        ANSIBLE_STDOUT_CALLBACK: default
      changed_when: false
      failed_when: >-
        resp.rc != 0
        or resp.stdout
          | regex_findall('image is still for iRODS ' ~ (_irods_version | regex_escape) ~ '[.]')
          | length != groups['irods_resource_container'] | length

    - name: Test irods_upgrade.yml reports nothing when the containerized servers are on its release or later
      ansible.builtin.command:
        argv: "{{ nested_run + ['--extra-vars=irods_version=' ~ item, playbook_dir ~ '/../irods_upgrade.yml'] }}"
      register: resp
      environment:
        ANSIBLE_STDOUT_CALLBACK: default
      changed_when: false
      failed_when: resp.rc != 0 or resp.stdout is search("image is still for iRODS|Couldn't look up")
      loop:
        - "{{ _irods_version }}"
        - 0.0.1
