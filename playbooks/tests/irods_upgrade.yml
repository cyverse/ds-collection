---
- name: Test upgrade iRODS
  hosts: irods:!irods_resource_container:!unmanaged_systems
  become: true
  vars_files:
    - ../group_vars/all/irods.yml
  tasks:
    - name: Gather the installed packages
      ansible.builtin.package_facts:

    - name: Verify the installed iRODS packages are the release
      ansible.builtin.assert:
        that: ansible_facts.packages[item][0].version is regex(release_pattern)
        fail_msg: >-
          {{ item }} {{ ansible_facts.packages[item][0].version }} is installed, not
          {{ _irods_version }}
      loop: >-
        {{ ansible_facts.packages.keys() | select('match', 'irods-(?!externals-)') | list }}
      vars:
        release_pattern: ^{{ _irods_version | regex_escape }}([.-]|$)

    - name: Verify the release's rule bases are installed
      when: "'irods-server' in ansible_facts.packages"
      ansible.builtin.import_tasks: tasks/irods/test_release_rulebases.yml

    - name: Verify the command scripts are still protected
      when: "'irods-server' in ansible_facts.packages"
      ansible.builtin.import_tasks: tasks/irods/test_cmd_scripts_protected.yml

    - name: Verify the upgraded servers are running
      when: "'irods-server' in ansible_facts.packages"
      become: true
      become_user: irods
      ansible.builtin.import_tasks: tasks/irods/test_running.yml

    - name: Verify the server reports the release
      when: "'irods-server' in ansible_facts.packages"
      become: true
      become_user: irods
      ansible.builtin.command: imiscsvrinfo
      register: resp
      changed_when: false
      failed_when: >-
        resp is failed
          or resp.stdout is not search('^relVersion=rods' ~ _irods_version ~ '$', multiline=true)


# irods_upgrade_seed.yml adds this data before the upgrade.
- name: Test upgrade iRODS | the Data Store's data and queued rules survive
  hosts: irods_catalog
  run_once: true
  become: true
  become_user: irods
  gather_facts: false
  vars_files:
    - ../group_vars/all/irods.yml
  tasks:
    - name: Verify the release's own rule bases are in force
      ansible.builtin.import_tasks: tasks/irods/test_release_rules_in_force.yml

    - name: Verify the replicated data object
      when: irods_upgrade_from is defined
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o errexit -o nounset -o pipefail
          coll="$(ipwd)"/upgrade-test
          rescs="$(iquest '%s' \
            "select DATA_RESC_NAME
             where COLL_NAME = '$coll' and DATA_NAME = 'replicated' and DATA_REPL_STATUS = '1'" \
            | sort | paste --serial --delimiters=,)"
          if [[ "$rescs" != ingestRes,replRes ]]; then
            printf 'good replicas on %s, not ingestRes and replRes\n' "$rescs" >&2
            exit 1
          fi
          ichksum -K -a "$coll"/replicated
          imeta ls -d "$coll"/replicated upgrade-test | grep --quiet '^value: seeded$'
      changed_when: false

    - name: Verify the replication queued before the upgrade runs after it
      when: irods_upgrade_from is defined
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o errexit -o nounset -o pipefail
          coll="$(ipwd)"/upgrade-test
          id="$(iquest '%s' \
            "select DATA_ID where COLL_NAME = '$coll' and DATA_NAME = 'queued'")"
          ruleId="$(iquest '%s' \
            "select RULE_EXEC_ID where RULE_EXEC_NAME like '%cyverse_repl_replicate%$id%'")"
          iqmod "$ruleId" exeTime "$(date +%s)"
          # The delay server checks the queue every 30 seconds.
          for _ in {1..24}; do
            if iquest '%s' \
                "select DATA_REPL_NUM
                 where DATA_ID = '$id' and DATA_RESC_NAME = 'replRes' and DATA_REPL_STATUS = '1'" \
              | grep --quiet '^[0-9]'
            then
              exit 0
            fi
            sleep 5
          done
          printf 'the queued replication of %s/queued did not run\n' "$coll" >&2
          exit 1
      changed_when: false


# The upgrade installs only the release's own rule bases, so the rest of the deployed configuration
# must already be what irods_cfg.yml deploys for the release.
- name: Test upgrade iRODS | the deployed configuration is the release's
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/irods.yml
  tasks:
    # The skipped tags are the ones the idempotency check skips.
    - name: Verify irods_cfg.yml would change nothing
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - --check
          - --inventory={{ ansible_inventory_sources | first }}
          - --limit=irods:!irods_resource_container:!unmanaged_systems
          - --skip-tags=no_testing,non_idempotent
          - --extra-vars=irods_version={{ _irods_version }}
          - "{{ playbook_dir }}/../irods_cfg.yml"
      register: resp
      environment:
        ANSIBLE_STDOUT_CALLBACK: default
      changed_when: false
      failed_when: resp is failed or resp.stdout is search('changed=[1-9]')
