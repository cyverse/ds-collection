---
# Copies the data object irods_resource_container_seed.yml added, through each containerized
# resource server and through the catalog provider, onto the server's resource. The testing
# environment runs it after upgrading the catalog provider, while the containerized servers still
# run the earlier release, and irods_resource_container.yml's test checks the copies. A failed copy
# leaves no data object for the test to find, so this doesn't stop the environment from starting.

- name: Use the containerized resource servers while the releases are mixed
  hosts: irods_resource_container
  become: true
  become_user: irods
  gather_facts: false
  vars_files:
    - vars/irods_resource_container.yml
  vars:
    copy_script: |
      set -o errexit -o nounset -o pipefail
      file="$(mktemp)"
      trap 'rm --force "$file"' EXIT
      iget -f -K "$1" "$file"
      iput -K -R "$3" "$file" "$2"
  tasks:
    - name: Copy the seeded data object through the server
      ansible.builtin.command:
        argv: "{{ in_container + ['bash', '-s', '--', upgrade_obj, mixed_server_obj, upgrade_resc] }}"
        stdin: "{{ copy_script }}"
      changed_when: true
      ignore_errors: true  # noqa: ignore-errors

    - name: Copy the seeded data object through the catalog provider
      delegate_to: "{{ groups['irods_catalog'][0] }}"
      ansible.builtin.command:
        argv: [bash, -s, --, "{{ upgrade_obj }}", "{{ mixed_provider_obj }}", "{{ upgrade_resc }}"]
        stdin: "{{ copy_script }}"
      changed_when: true
      ignore_errors: true  # noqa: ignore-errors
