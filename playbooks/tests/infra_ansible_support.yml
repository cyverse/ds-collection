---
- name: Test install required packages for ansible
  hosts: all:!unmanaged_systems:!localhost
  become: true
  tasks:
    - name: Test Update CentOS base repo
      when: ansible_distribution == 'CentOS'
      ansible.builtin.command: grep --quiet '7.9.2009' /etc/yum.repos.d/CentOS-Base.repo
      changed_when: false

    - name: Test install packages
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      with_items:
        - acl
        - dmidecode
        - jq
        # On EL8, python36 is the package that provides python3.
        - "{{ 'python36' if ansible_os_family == 'RedHat' and ansible_distribution_major_version == '8' else 'python3' }}"
        - python3-pip
      loop_control:
        loop_var: pkg

    - name: Test install packages on CentOS
      when: ansible_distribution == 'CentOS'
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      with_items:
        - epel-release
        - iproute
        - libselinux-python
        - python-dns
        - python-requests
        - python-virtualenv
        - python2-pip
        - yum-plugin-versionlock
      loop_control:
        loop_var: pkg

    - name: Test install packages on EL8 and EL9
      when: ansible_os_family == 'RedHat' and ansible_distribution_major_version in ['8', '9']
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      with_items:
        - epel-release
        - iproute
        - python3-dnf-plugin-versionlock
        - python3-dns
        - python3-libselinux
        - python3-requests
        - python3-virtualenv
      loop_control:
        loop_var: pkg

    - name: Test CRB repository enabled on EL8 and EL9
      when: ansible_os_family == 'RedHat' and ansible_distribution_major_version in ['8', '9']
      vars:
        repo: "{{ 'powertools' if ansible_distribution_major_version == '8' else 'crb' }}"
      ansible.builtin.command: dnf repolist --enabled {{ repo }}
      register: resp
      changed_when: false
      failed_when: resp.stdout is not regex('^' ~ repo ~ ' ', multiline=true)

    - name: Test install packages on Ubuntu
      when: ansible_distribution == 'Ubuntu'
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      with_items:
        - iproute2
        - python3-dns
        - python3-requests
        - python3-selinux
        - python3-virtualenv
      loop_control:
        loop_var: pkg

    - name: Verify pip upgraded on CentOS 7
      when: ansible_distribution == 'CentOS'
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: '[[ "$(pip --version)" =~ pip\ 20 ]]'
      changed_when: false

    - name: Test install packages on Ubuntu 22.04
      when: >-
        ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('22.04', '>=')
      ansible.builtin.include_tasks: tasks/test_pkg_installed.yml
      vars:
        pkg: python-is-python3

- name: Test uninstall packages on ubuntu
  hosts: all:!unmanaged_systems:!localhost
  become: true
  tasks:
    - name: Block for ubuntu distribution
      when: ansible_distribution == 'Ubuntu'
      block:
        - name: Gather the package facts
          ansible.builtin.package_facts:
            manager: "auto"

        - name: Fail if unattended-upgrades package is present
          ansible.builtin.fail:
          when: "'unattended-upgrades' in ansible_facts.packages"
