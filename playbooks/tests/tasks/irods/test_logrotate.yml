---
# Tests that log rotation is configured for iRODS with the default retention

- name: Test iRODS log rotation | retrieve encoded configuration
  ansible.builtin.slurp:
    src: /etc/logrotate.d/irods
  register: logrotate_encoded

- name: Test iRODS log rotation | verify configuration
  vars:
    logrotate: "{{ logrotate_encoded.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - logrotate is search('^/var/log/irods/irods.log {$', multiline=true)
      - logrotate is search('^\s+rotate 26$', multiline=true)
