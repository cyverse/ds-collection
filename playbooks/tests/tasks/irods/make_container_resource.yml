---
# Makes a unixfilesystem resource on a containerized resource server, once the server answers.
# Variables:
#  _container_resc        the resource's name
#  _container_resc_vault  its vault, relative to the server's vault
#  in_container           the command that runs a command as irods in the server's container
- name: Make container resource | wait for the server to answer requests
  ansible.builtin.command:
    argv: "{{ in_container + ['ils'] }}"
  register: resp
  changed_when: false
  until: resp is succeeded
  retries: 30
  delay: 2

- name: Make container resource | create {{ _container_resc }}
  ansible.builtin.command:
    argv: >-
      {{ in_container
        + ['bash', '-c', 'iadmin mkresc "$1" unixfilesystem "$2:$IRODS_VAULT_PATH/$3"', '_']
        + [_container_resc, inventory_hostname, _container_resc_vault] }}
  changed_when: true
