---
- name: Test iRODS running | verify that the server is up
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      if ! status="$(/var/lib/irods/irodsctl status)"; then
        exit 1
      fi
      grep --after-context=1 '^irodsServer :' <<< "$status" | grep --quiet 'Process [0-9]'
  changed_when: false
